[package]
name = "qpa-gbnp"
description = "Source-faithful Rust translation of the GBNP machinery used by QPA"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["numerica-no-gmp"]
numerica-no-gmp = ["numerica/no_gmp", "qpa-core/numerica-no-gmp"]
numerica-gmp = ["numerica/gmp", "qpa-core/numerica-gmp"]

[dependencies]
numerica.workspace = true
qpa-core = { version = "0.2.0", path = "../qpa-core", default-features = false }
rand.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
