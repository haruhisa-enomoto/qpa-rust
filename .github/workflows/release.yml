name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# The build script embeds the checkout's HEAD; inside maturin's build containers
# git is unavailable, so the commit is passed explicitly.
env:
  QPA_PORT_GIT_COMMIT: ${{ github.sha }}

jobs:
  metadata:
    name: Release version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check versions and release tag
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$RELEASE_REF_TYPE" = tag ]; then
            python scripts/check-release-version "$RELEASE_REF_NAME"
          else
            python scripts/check-release-version
          fi

  wheels:
    name: Wheels for ${{ matrix.platform.name }}
    needs: [metadata]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64 }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64 }
          - { name: macos-x86_64, runner: macos-latest, target: x86_64 }
          - { name: macos-arm64, runner: macos-latest, target: aarch64 }
          - { name: windows-x86_64, runner: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: auto
          args: --release --out dist --interpreter 3.10 3.11 3.12 3.13
          docker-options: -e QPA_PORT_GIT_COMMIT
          sccache: "true"
      - name: Verify installed Linux wheel
        if: runner.os == 'Linux'
        run: |
          python -m pip install --no-index --find-links dist qpa-rust
          python -m pip install pytest
          python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import os
          import tomllib
          import qpa
          expected = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert version("qpa-rust") == expected
          assert not Path(qpa.__file__).resolve().is_relative_to(Path.cwd())
          assert qpa.PORT_GIT_COMMIT == os.environ["QPA_PORT_GIT_COMMIT"], qpa.PORT_GIT_COMMIT
          PY
          python -I -m pytest -q python/tests
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.name }}
          path: dist/*.whl

  sdist:
    name: Source distribution
    needs: [metadata]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  github-release:
    name: Attach artifacts to the GitHub release
    needs: [wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                 --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  pypi:
    name: Publish to PyPI
    needs: [wheels, sdist]
    # Enable by creating a PyPI trusted publisher for this repository and
    # workflow, then setting the repository variable PUBLISH_TO_PYPI=true.
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
