name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [default, gmp]
    steps:
      - uses: actions/checkout@v4
      - name: Install system Python with shared libpython
        run: sudo apt-get update && sudo apt-get install -y python3-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.backend }}
      - name: Format
        if: matrix.backend == 'default'
        run: cargo fmt --all -- --check
      - name: Test
        env:
          PYO3_PYTHON: /usr/bin/python3
          RUSTFLAGS: ""
        run: |
          if [ "${{ matrix.backend }}" = gmp ]; then
            cargo test --workspace --all-targets --no-default-features --features numerica-gmp
          else
            cargo test --workspace --all-targets
          fi
      - name: Clippy
        env:
          PYO3_PYTHON: /usr/bin/python3
          RUSTFLAGS: ""
        run: |
          if [ "${{ matrix.backend }}" = gmp ]; then
            cargo clippy --workspace --all-targets --no-default-features --features numerica-gmp -- -D warnings
          else
            cargo clippy --workspace --all-targets -- -D warnings
          fi
      - name: Rustdoc
        env:
          PYO3_PYTHON: /usr/bin/python3
          RUSTFLAGS: ""
          RUSTDOCFLAGS: -D warnings
        run: |
          if [ "${{ matrix.backend }}" = gmp ]; then
            cargo doc --workspace --no-deps --no-default-features --features numerica-gmp
          else
            cargo doc --workspace --no-deps
          fi

  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install build and test tools
        run: python -m pip install --upgrade pip "maturin>=1.9.4,<2" pytest
      - name: Binding ledger is complete
        if: runner.os == 'Linux'
        run: scripts/check-python-ledger
      - name: Generated Python documentation is current
        if: runner.os == 'Linux'
        run: python3 scripts/generate-python-docs --check
      - name: Build and install the extension
        run: maturin develop --release
      - name: Python tests
        run: python -m pytest -q python/tests
