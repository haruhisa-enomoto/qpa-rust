[workspace]
members = [
    "crates/qpa-core",
    "crates/qpa-gbnp",
    "crates/qpa-porting",
    "crates/qpa-python",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-2.0-or-later"
repository = "https://github.com/italing/qpa-rust"

[workspace.dependencies]
numerica = { version = "=2.1.0", default-features = false }
pyo3 = { version = "=0.29.0", features = ["multiple-pymethods"] }
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
